server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Assets con hash en el nombre (Vite) -> cache agresiva e inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca cacheado: es el que apunta a los assets nuevos en cada deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # El service worker de MSW tampoco se cachea (aunque en prod va apagado)
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache";
    }

    # FALLBACK DE SPA: React Router maneja las rutas en el cliente.
    # Cualquier path que no sea un archivo real -> index.html (y NO un 404).
    # Esto sirve también /silent-sso.html y /empresas, /login, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
